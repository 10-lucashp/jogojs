<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo</title>

    <link rel="stylesheet" href="/JOGO-IW-main/ProjetoJogoMemoria/CSS/style.css">
</head>

<body>

    <div class="game-board" id="gameBoard"></div>

    <!-- ÁUDIO DE ENTRADA -->
    <audio id="somEntrada" preload="auto">
        <source src="../AUDIOS/mariosomlets.mp3" type="audio/mpeg">
    </audio>

    <!-- ÁUDIO DA RISADA -->
    <audio id="somTempo" preload="auto">
        <source src="../AUDIOS/risadakiko.mp3" type="audio/mpeg">
    </audio>

    <!-- ÁUDIO DE ACERTO -->
    <audio id="somAcerto" preload="auto"></audio>

    <!-- ÁUDIO DE VITÓRIA -->
    <audio id="somVitoria" preload="auto">
        <source src="../AUDIOS/ronaldin.mp3" type="audio/mpeg">
    </audio>

    <script>

        function tocarAudio() {

            const audio = document.getElementById('somEntrada');

            audio.play().catch(error => {
                console.log("Aguardando interação...");
            });
        }

        window.addEventListener('load', tocarAudio);

        document.addEventListener('click', tocarAudio, { once: true });

        document.addEventListener('touchstart', tocarAudio, { once: true });

        document.addEventListener('keydown', tocarAudio, { once: true });

    </script>

    <script src="../JavaScript/script.js"></script>

</body>

</html>
